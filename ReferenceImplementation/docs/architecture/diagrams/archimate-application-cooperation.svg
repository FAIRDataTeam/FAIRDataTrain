<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" font-family="Helvetica, Arial, sans-serif">
  <desc>ArchiMate application cooperation view: the FAIR Data Station's internal components and their interactions with the Train Handler, trains, OIDC provider, data backends and an optional external FAIR Data Point.</desc>
  <defs>
    <marker id="openArrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#555" stroke-width="1.4"/></marker>
    <marker id="filledArrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#555" stroke="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="580" fill="#ffffff"/>
  <text x="24" y="26" font-size="15" font-weight="bold" fill="#333">FAIR Data Station — application cooperation view</text>

  <rect x="520" y="40" width="220" height="45" fill="#FFFFB5" stroke="#A0A048"/>
  <g fill="none" stroke="#7A7430" stroke-width="1.2" transform="translate(722,48)"><circle cx="4" cy="3" r="3"/><path d="M4 6V12M0 8H8M1 15L4 12L7 15"/></g>
  <text x="630" y="60" font-size="12" fill="#333" text-anchor="middle">Data Controllers ·</text>
  <text x="630" y="75" font-size="12" fill="#333" text-anchor="middle">Station Owner</text>
  <line x1="630" y1="85" x2="630" y2="146" stroke="#555" marker-end="url(#openArrow2)"/>
  <text x="640" y="120" font-size="10" fill="#555">manage policies</text>

  <rect x="280" y="120" width="480" height="380" fill="#DDF4FB" stroke="#4E97B4"/>
  <text x="296" y="141" font-size="13" font-weight="bold" fill="#2A6076">FAIR Data Station</text>
  <g transform="translate(726,128)" stroke="#4E97B4" fill="#ffffff"><rect x="4" y="0" width="14" height="18"/><rect x="0" y="3" width="8" height="4"/><rect x="0" y="10" width="8" height="4"/></g>

  <g fill="#C7EFFA" stroke="#4E97B4">
    <rect x="300" y="150" width="200" height="40"/>
    <rect x="300" y="215" width="200" height="40"/>
    <rect x="520" y="150" width="220" height="130"/>
    <rect x="300" y="305" width="440" height="105"/>
    <rect x="300" y="435" width="200" height="40"/>
    <rect x="520" y="435" width="220" height="40"/>
  </g>
  <g fill="#EFFAFE" stroke="#4E97B4">
    <rect x="532" y="183" width="196" height="26"/>
    <rect x="532" y="215" width="196" height="26"/>
    <rect x="532" y="247" width="196" height="26"/>
    <rect x="312" y="343" width="96" height="30"/>
    <rect x="420" y="343" width="96" height="30"/>
    <rect x="528" y="343" width="96" height="30"/>
    <rect x="636" y="343" width="96" height="30"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="400" y="174">Dispatch Gateway</text>
    <text x="400" y="239">Job Orchestrator</text>
    <text x="630" y="172" font-weight="bold">Policy Subsystem</text>
    <text x="630" y="200">Policy Admin (PAP)</text>
    <text x="630" y="232">Negotiation (PDP)</text>
    <text x="630" y="264">Agreement Store</text>
    <text x="520" y="328" font-weight="bold">Interaction Mechanism SPI</text>
    <text x="360" y="362">SPARQL</text>
    <text x="468" y="362">SQL</text>
    <text x="576" y="362">API / FHIR</text>
    <text x="684" y="362">Docker</text>
    <text x="520" y="396" font-size="10.5" font-style="italic" fill="#555">adapters enabled per deployment; Docker executor runs process-isolated</text>
    <text x="400" y="459">Metadata (FDP API)</text>
    <text x="630" y="452">Audit Log</text>
    <text x="630" y="466" font-size="10" font-style="italic" fill="#555">receives events from all components</text>
  </g>
  <g stroke="#555" fill="none" marker-end="url(#openArrow2)">
    <line x1="400" y1="190" x2="400" y2="213"/>
    <line x1="400" y1="255" x2="400" y2="303"/>
    <line x1="518" y1="228" x2="502" y2="228"/>
  </g>

  <g fill="#C7EFFA" stroke="#4E97B4">
    <rect x="30" y="140" width="180" height="60"/>
    <rect x="30" y="390" width="180" height="60"/>
  </g>
  <rect x="30" y="260" width="180" height="60" fill="#FFFFB5" stroke="#A0A048"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="120" y="166">Train Handler</text>
    <text x="120" y="182" font-size="10.5" fill="#555">dispatch · directory</text>
    <text x="120" y="286">Train / Consumer</text>
    <text x="120" y="302" font-size="10.5" fill="#555">requesting party</text>
    <text x="120" y="416">OIDC Provider</text>
    <text x="120" y="432" font-size="10.5" fill="#555">federated identity</text>
  </g>

  <path d="M840 300 l8 -8 h180 l-8 8 Z" fill="#CFE8C0" stroke="#6B9A50"/>
  <path d="M1020 292 l8 -8 v82 l-8 8 Z" fill="#CFE8C0" stroke="#6B9A50"/>
  <rect x="840" y="300" width="180" height="82" fill="#CFE8C0" stroke="#6B9A50"/>
  <text x="930" y="330" font-size="12" fill="#333" text-anchor="middle">Data backends</text>
  <text x="930" y="348" font-size="10.5" fill="#555" text-anchor="middle">triple store · RDBMS</text>
  <text x="930" y="363" font-size="10.5" fill="#555" text-anchor="middle">FHIR / APIs · files</text>
  <rect x="840" y="420" width="180" height="60" fill="#C7EFFA" stroke="#4E97B4"/>
  <text x="930" y="446" font-size="12" fill="#333" text-anchor="middle">FAIR Data Point</text>
  <text x="930" y="462" font-size="10.5" font-style="italic" fill="#555" text-anchor="middle">(optional, external)</text>

  <g stroke="#555" fill="none" stroke-dasharray="6,3" marker-end="url(#filledArrow2)">
    <line x1="210" y1="158" x2="278" y2="158"/>
    <line x1="278" y1="182" x2="210" y2="182"/>
    <line x1="210" y1="285" x2="278" y2="285"/>
    <line x1="760" y1="335" x2="838" y2="335"/>
  </g>
  <text x="244" y="150" font-size="10" fill="#555" text-anchor="middle">push jobs</text>
  <text x="244" y="196" font-size="10" fill="#555" text-anchor="middle">poll jobs</text>
  <text x="244" y="277" font-size="10" fill="#555" text-anchor="middle">negotiate</text>
  <text x="244" y="300" font-size="10" fill="#555" text-anchor="middle">(ODRL)</text>
  <text x="799" y="327" font-size="10" fill="#555" text-anchor="middle">query /</text>
  <text x="799" y="349" font-size="10" fill="#555" text-anchor="middle">execute</text>
  <line x1="210" y1="415" x2="278" y2="415" stroke="#555" marker-end="url(#openArrow2)"/>
  <text x="244" y="407" font-size="10" fill="#555" text-anchor="middle">authn</text>
  <line x1="760" y1="450" x2="838" y2="450" stroke="#555" stroke-dasharray="2,3"/>
  <text x="799" y="442" font-size="10" fill="#555" text-anchor="middle">sync</text>

  <g font-size="11" fill="#444">
    <line x1="40" y1="540" x2="90" y2="540" stroke="#555" stroke-dasharray="6,3" marker-end="url(#filledArrow2)"/>
    <text x="98" y="544">flow (information)</text>
    <line x1="220" y1="540" x2="270" y2="540" stroke="#555" marker-end="url(#openArrow2)"/>
    <text x="278" y="544">serving</text>
    <line x1="350" y1="540" x2="400" y2="540" stroke="#555" stroke-dasharray="2,3"/>
    <text x="408" y="544">association</text>
    <rect x="500" y="532" width="14" height="12" fill="#FFFFB5" stroke="#A0A048"/><text x="520" y="543">business role</text>
    <rect x="620" y="532" width="14" height="12" fill="#C7EFFA" stroke="#4E97B4"/><text x="640" y="543">application</text>
    <rect x="730" y="532" width="14" height="12" fill="#CFE8C0" stroke="#6B9A50"/><text x="750" y="543">technology</text>
  </g>
</svg>
