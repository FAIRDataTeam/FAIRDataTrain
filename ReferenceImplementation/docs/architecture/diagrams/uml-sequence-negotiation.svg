<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" font-family="Helvetica, Arial, sans-serif">
  <desc>UML sequence diagram of ODRL agreement negotiation at a FAIR Data Station, with an alt fragment covering automatic approval and human-in-the-loop approval by the data controller.</desc>
  <defs>
    <marker id="sfill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#444" stroke="#444"/></marker>
    <marker id="sopen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#444" stroke-width="1.3"/></marker>
  </defs>
  <rect x="0" y="0" width="920" height="700" fill="#ffffff"/>
  <text x="24" y="26" font-size="15" font-weight="bold" fill="#333">Agreement negotiation — UML sequence diagram</text>

  <g stroke="#888" stroke-dasharray="4,4">
    <line x1="100" y1="76" x2="100" y2="640"/>
    <line x1="280" y1="76" x2="280" y2="640"/>
    <line x1="460" y1="76" x2="460" y2="640"/>
    <line x1="640" y1="76" x2="640" y2="640"/>
    <line x1="830" y1="76" x2="830" y2="640"/>
  </g>
  <g fill="#EDF2F7" stroke="#5B7A99">
    <rect x="30" y="40" width="140" height="36"/>
    <rect x="210" y="40" width="140" height="36"/>
    <rect x="390" y="40" width="140" height="36"/>
    <rect x="570" y="40" width="140" height="36"/>
    <rect x="760" y="40" width="140" height="36"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="100" y="62">Train / Consumer</text>
    <text x="280" y="62">Dispatch Gateway</text>
    <text x="460" y="62">Negotiation (PDP)</text>
    <text x="640" y="62">Agreement Store</text>
    <text x="830" y="57">Data Controller</text>
    <text x="830" y="71" font-weight="normal" font-size="10.5">«human»</text>
  </g>

  <g stroke="#444" fill="none" marker-end="url(#sfill)">
    <line x1="100" y1="110" x2="278" y2="110"/>
    <path d="M280 140 h44 v16 h-44" marker-end="url(#sfill)"/>
    <line x1="280" y1="192" x2="458" y2="192"/>
    <path d="M460 222 h44 v16 h-44" marker-end="url(#sfill)"/>
    <line x1="460" y1="290" x2="638" y2="290"/>
    <line x1="460" y1="432" x2="638" y2="432"/>
    <line x1="640" y1="522" x2="828" y2="522"/>
    <line x1="830" y1="552" x2="642" y2="552"/>
    <path d="M640 578 h44 v16 h-44" marker-end="url(#sfill)"/>
  </g>
  <g stroke="#444" fill="none" stroke-dasharray="5,4" marker-end="url(#sopen)">
    <line x1="640" y1="318" x2="462" y2="318"/>
    <line x1="460" y1="346" x2="282" y2="346"/>
    <line x1="280" y1="374" x2="102" y2="374"/>
    <line x1="460" y1="460" x2="282" y2="460"/>
    <line x1="280" y1="488" x2="102" y2="488"/>
    <line x1="640" y1="614" x2="102" y2="614"/>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="190" y="103">POST ODRL Request (OIDC token)</text>
    <text x="288" y="134" text-anchor="start">PEP 1: authn · validate (SHACL)</text>
    <text x="370" y="185">match(request)</text>
    <text x="512" y="229" text-anchor="start">evaluate offers ×</text>
    <text x="512" y="243" text-anchor="start">station policy</text>
    <text x="550" y="283">create agreement (active, signed)</text>
    <text x="550" y="311">agreement ref</text>
    <text x="370" y="339">agreement</text>
    <text x="190" y="367">201 Created — signed agreement</text>
    <text x="550" y="425">create agreement (pending-approval)</text>
    <text x="370" y="453">pending</text>
    <text x="190" y="481">202 Accepted — status URL</text>
    <text x="735" y="515">notify: approval requested</text>
    <text x="735" y="545">approve / deny</text>
    <text x="692" y="585" text-anchor="start">state → active;</text>
    <text x="692" y="599" text-anchor="start">sign</text>
    <text x="370" y="607">agreement active (callback / status poll)</text>
  </g>
  <rect x="60" y="256" width="820" height="374" fill="none" stroke="#777" stroke-width="1.2"/>
  <path d="M60 256 h52 v18 l-8 8 h-44 Z" fill="#EDEDED" stroke="#777"/>
  <text x="72" y="272" font-size="11.5" font-weight="bold" fill="#333">alt</text>
  <text x="126" y="272" font-size="11" font-style="italic" fill="#555">[auto-approval]</text>
  <line x1="60" y1="398" x2="880" y2="398" stroke="#777" stroke-dasharray="7,4"/>
  <text x="72" y="416" font-size="11" font-style="italic" fill="#555">[approval required by controller's offer]</text>

  <text x="60" y="662" font-size="10.5" font-style="italic" fill="#555">All decisions and state changes are written to the audit log.</text>
  <text x="60" y="678" font-size="10.5" font-style="italic" fill="#555">Party identities are recorded VC-ready (issuer · subject · proof method), OIDC-backed in v1.</text>
</svg>
