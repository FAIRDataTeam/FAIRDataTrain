<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1400" font-family="Helvetica, Arial, sans-serif">
  <desc>UML activity diagram of FAIR Data Station job handling: reception, PEP checkpoints, agreement negotiation with optional human approval, execution via a mechanism adapter, result checks and obligations.</desc>
  <defs>
    <marker id="uarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#444" stroke="#444"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="1400" fill="#ffffff"/>
  <text x="24" y="28" font-size="15" font-weight="bold" fill="#333">Job handling — UML activity diagram</text>

  <circle cx="280" cy="52" r="9" fill="#444"/>
  <g fill="#F4F6F8" stroke="#5B7A99" stroke-width="1.2">
    <rect x="130" y="80" width="300" height="44" rx="14"/>
    <rect x="130" y="154" width="300" height="52" rx="14"/>
    <rect x="130" y="880" width="300" height="40" rx="14"/>
    <rect x="130" y="950" width="300" height="52" rx="14"/>
    <rect x="130" y="1110" width="300" height="44" rx="14"/>
    <rect x="130" y="1184" width="300" height="52" rx="14"/>
    <rect x="130" y="1266" width="300" height="52" rx="14"/>
    <rect x="480" y="330" width="280" height="52" rx="14"/>
    <rect x="480" y="560" width="280" height="64" rx="14"/>
    <rect x="480" y="740" width="280" height="52" rx="14"/>
    <rect x="620" y="1140" width="200" height="50" rx="14"/>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="106">Receive job (push endpoint / poll worker)</text>
    <text x="280" y="176">PEP 1 — authenticate requester;</text>
    <text x="280" y="193">validate payload (SHACL)</text>
    <text x="280" y="904">Enqueue job</text>
    <text x="280" y="972">PEP 2 — pre-execution check</text>
    <text x="280" y="989">(agreement · station policy · quotas)</text>
    <text x="280" y="1136">Execute via mechanism adapter (isolated)</text>
    <text x="280" y="1206">Collect results;</text>
    <text x="280" y="1223">PEP 3 — result &amp; obligation check</text>
    <text x="280" y="1288">Deliver results;</text>
    <text x="280" y="1305">schedule post-execution obligations</text>
    <text x="620" y="352">Match request × offers</text>
    <text x="620" y="369">+ station policy (PDP)</text>
    <text x="620" y="582">Create agreement (pending-approval);</text>
    <text x="620" y="599">notify data controller;</text>
    <text x="620" y="616">await decision</text>
    <text x="620" y="762">Activate + sign agreement;</text>
    <text x="620" y="779">share with train</text>
    <text x="720" y="1161">Reject job / request;</text>
    <text x="720" y="1178">record in audit log</text>
  </g>

  <g fill="#FDF7EC" stroke="#B08840" stroke-width="1.2">
    <path d="M280 234 L380 266 L280 298 L180 266 Z"/>
    <path d="M620 404 L700 432 L620 460 L540 432 Z"/>
    <path d="M620 482 L700 510 L620 538 L540 510 Z"/>
    <path d="M620 646 L700 674 L620 702 L540 674 Z"/>
    <path d="M280 1032 L350 1056 L280 1080 L210 1056 Z"/>
    <path d="M280 838 L292 850 L280 862 L268 850 Z" fill="#F4F6F8" stroke="#5B7A99"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="280" y="262">active agreement</text>
    <text x="280" y="277">referenced?</text>
    <text x="620" y="437">match found?</text>
    <text x="620" y="507">approval</text>
    <text x="620" y="521">required?</text>
    <text x="620" y="679">approved?</text>
    <text x="280" y="1061">permit?</text>
  </g>

  <g stroke="#444" fill="none" marker-end="url(#uarr)">
    <line x1="280" y1="61" x2="280" y2="78"/>
    <line x1="280" y1="124" x2="280" y2="152"/>
    <line x1="280" y1="206" x2="280" y2="232"/>
    <polyline points="380,266 620,266 620,328"/>
    <line x1="280" y1="298" x2="280" y2="836"/>
    <line x1="620" y1="382" x2="620" y2="402"/>
    <line x1="620" y1="460" x2="620" y2="480"/>
    <line x1="620" y1="538" x2="620" y2="558"/>
    <polyline points="540,510 470,510 470,766 478,766"/>
    <line x1="620" y1="702" x2="620" y2="738"/>
    <polyline points="620,792 620,850 294,850"/>
    <line x1="280" y1="862" x2="280" y2="878"/>
    <line x1="280" y1="920" x2="280" y2="948"/>
    <line x1="280" y1="1002" x2="280" y2="1030"/>
    <line x1="280" y1="1080" x2="280" y2="1108"/>
    <line x1="280" y1="1154" x2="280" y2="1182"/>
    <line x1="280" y1="1236" x2="280" y2="1264"/>
    <line x1="280" y1="1318" x2="280" y2="1346"/>
    <polyline points="700,432 790,432 790,1138"/>
    <polyline points="700,674 790,674"/>
    <polyline points="350,1056 790,1056"/>
    <line x1="720" y1="1190" x2="720" y2="1246"/>
  </g>
  <g font-size="11" fill="#666">
    <text x="395" y="258">no</text>
    <text x="290" y="320">yes</text>
    <text x="710" y="424">no</text>
    <text x="628" y="474">yes</text>
    <text x="480" y="502">no — auto</text>
    <text x="628" y="642">yes</text>
    <text x="710" y="666">no</text>
    <text x="290" y="1098">yes</text>
    <text x="360" y="1048">no</text>
  </g>

  <circle cx="280" cy="1360" r="10" fill="none" stroke="#444" stroke-width="1.5"/>
  <circle cx="280" cy="1360" r="5.5" fill="#444"/>
  <circle cx="720" cy="1260" r="10" fill="none" stroke="#444" stroke-width="1.5"/>
  <circle cx="720" cy="1260" r="5.5" fill="#444"/>

  <g>
    <path d="M40 940 h150 l14 14 v86 h-164 Z" fill="#FFFBE6" stroke="#B0A860"/>
    <path d="M190 940 v14 h14" fill="none" stroke="#B0A860"/>
    <text x="52" y="962" font-size="10.5" fill="#555">Every checkpoint decision,</text>
    <text x="52" y="977" font-size="10.5" fill="#555">state change and execution</text>
    <text x="52" y="992" font-size="10.5" fill="#555">emits an audit event linked</text>
    <text x="52" y="1007" font-size="10.5" fill="#555">to the governing agreement.</text>
    <line x1="204" y1="990" x2="228" y2="985" stroke="#B0A860" stroke-dasharray="3,3"/>
  </g>
</svg>
